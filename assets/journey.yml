- number: "01"
  title: "Price orientation"
  kicker: "Start with the question customers actually have"
  text: "The Price Check gives visitors a fast way to understand whether the project is financially realistic before asking them to configure every detail."
  signal: "Research → price confidence"
- number: "02"
  title: "Project configuration"
  kicker: "Turn a product list into a guided planning task"
  text: "The fence configurator translates length, height, corners, gates, mounting and accessories into a project-specific material plan."
  signal: "Price confidence → project clarity"
- number: "03"
  title: "Installation guidance"
  kicker: "Answer uncertainty where it appears"
  text: "Cutting, wall connections, non-90° corners and mounting options are explained inside the planning flow instead of being left for the customer to research elsewhere."
  signal: "Project clarity → installation confidence"
- number: "04"
  title: "Privacy-screen design"
  kicker: "Extend the same project instead of restarting it"
  text: "Customers can add privacy screening, choose colors and explore single-, two- or three-color patterns without leaving the overall fence-planning context."
  signal: "Core project → personalized extension"
- number: "05"
  title: "Cart conflict protection"
  kicker: "Remember what the customer already did"
  text: "If items were added earlier through the Price Check, the configurator can warn about overlaps and let the customer replace or keep existing positions."
  signal: "Configuration → error prevention"
- number: "06"
  title: "Complete-cart review"
  kicker: "End with confidence, not another surprise"
  text: "The final cart brings the planned project together for one last review before checkout, supported by delivery, payment and order-check information."
  signal: "Prepared cart → purchase readiness"
